services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # These vars must be set before running in production (e.g. in a .env file).
      MYSQL_DATABASE: llm_gateway
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - gateway_mysql:/var/lib/mysql

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "3000:3000"
    environment:
      # These vars must be set before running in production (e.g. in a .env file).
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/llm_gateway
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  gateway_mysql:
